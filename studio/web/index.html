<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c22">
  <meta name="description" content="一段可以离线游玩的 RPG。走上观测岭找回透镜，为海上的船点亮灯塔。">
  <title>最后一座灯塔</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="game-data.js"></script>
  <script defer src="game.js"></script>
  <script defer src="world.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div><h1>最后一座灯塔</h1><p>风暴过后，灯港还在等船回来。</p></div>
      <button class="quiet" id="restart" type="button">重新开始</button>
    </header>
    <div class="play">
      <div class="location"><strong id="map-name"></strong><span id="reward">0 G</span></div>
      <canvas id="world" width="640" height="480" aria-label="当前地图。守灯人位于起点北面。"></canvas>
      <section id="dialog" class="dialog" aria-label="对话" hidden>
        <p id="dialog-text" aria-live="polite"></p>
        <div id="options"></div>
        <button id="continue" type="button">继续 <span aria-hidden="true">↵</span></button>
      </section>
    </div>
    <section class="under" aria-label="任务与操作">
      <ol id="objectives" aria-label="任务进度"></ol>
      <p id="hint" aria-live="polite"></p>
      <p class="keys">方向键移动 <span>·</span> Enter / Z 确认</p>
      <div class="touch" aria-label="触屏操作">
        <div class="dpad">
          <button class="up" data-move="8" aria-label="向上" type="button">▲</button>
          <button class="left" data-move="4" aria-label="向左" type="button">◀</button>
          <button class="down" data-move="2" aria-label="向下" type="button">▼</button>
          <button class="right" data-move="6" aria-label="向右" type="button">▶</button>
        </div>
        <button id="interact" type="button">交互</button>
      </div>
    </section>
  </main>
</body>
</html>
